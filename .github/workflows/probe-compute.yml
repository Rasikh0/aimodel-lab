name: probe-compute

on:
  push:
  workflow_dispatch:

jobs:
  probe-compute:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Core AI toolchain
        if: always()
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install coreai-torch==0.4.2 coreai-opt==0.2.1

      - name: Runtime API surface
        if: always()
        run: |
          echo "--- top-level public names ---"
          python3 -c "import coreai; print([n for n in dir(coreai) if not n.startswith('_')])"
          echo "--- submodules ---"
          python3 -c "
          import coreai, pkgutil
          for m in pkgutil.iter_modules(coreai.__path__):
              print(' ', m.name)
          "
          echo "--- non-compiler files ---"
          python3 -m pip show -f coreai-core | grep -E "^  coreai/" | grep -v "__pycache__" | grep -v "_compiler" | head -60